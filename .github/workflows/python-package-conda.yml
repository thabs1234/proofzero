name: ProofZero tools

on: [push, pull_request]

jobs:
  tools:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install mpmath
    - name: Lint for syntax errors and undefined names
      run: |
        python -m pip install flake8
        # fail on syntax errors / undefined names; style is advisory
        flake8 tools --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: _status.json agrees with the notes and the tools
      run: |
        # Guards against the machine-readable mirror drifting from the prose.
        python tools/check_status.py
    - name: Self-checks and negative controls
      run: |
        # These must fail loudly if their subject is broken:
        #  - _control_rh.py plants an off-line root; rh_zeros must notice
        #  - pnp_probe --self-check cross-validates DPLL against brute force
        python tools/rh_zeros.py 20
        python tools/_control_rh.py
        python tools/pnp_probe.py --self-check
    - name: Bounded finite-evidence runs
      run: |
        python tools/collatz_hunt.py 10000 --top 3
        python tools/goldbach_twins.py 20000 --sample
        python tools/pnp_probe.py 15 4.26
    - name: Full make verify (must exit non-zero on any regression)
      run: |
        # The same target a contributor runs locally. Deliberately named
        # "verify" and not "green": no check here advances a conjecture.
        make verify
